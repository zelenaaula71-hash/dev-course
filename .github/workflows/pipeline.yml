name: deploy

on:
  push:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t app:${{ github.sha }} -t app:latest ./python

      - name: Deploy
        run: |
          docker rm -f app || true
          docker run -d -p 8080:80 --name app app:latest
